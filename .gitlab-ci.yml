stages:
  - linters
  - tests
  - final

ruff:
  allow_failure: true
  stage: linters
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install ruff

  script:
    - echo "Запуск ruff"
    - ruff check .

flake8:
  allow_failure: true
  stage: linters
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE =="merge_request_event"'

  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install flake8

  script:
    - echo "Запуск flake8"
    - flake8 . > flake8-results.txt

  artifacts:
    when: always
    paths:
      - flake8-results.txt
    expire_in: 7 days

pylint:
  allow_failure: true
  stage: linters
  image: python:3.12
  rules:
    - if: '$CI_PIPELINE_SOURCE =="merge_request_event"'

  before_script:
    - python --version
    - pip install --upgrade pip
    - pip install pylint

  script:
    - echo "Запуск pylint"
    - pylint .

tests:
  stage: tests
  image: python:3.12
  rules:
    - when: always

  before_script:
    - echo "Установка пакетов"
    - apt-get update -y
    - apt-get install -y --no-install-recommends default-jre-headless nodejs npm
    - npm install -g allure --unsafe-perm=true

    - echo "Установка зависимостей"
    - pip install --upgrade pip
    - pip install -r requirements.txt

  script:
    - |
      set +e
      echo "Запуск тестов с маркировкой api"
      pytest -m api

      status=$?
      echo "Pytest exit code $status"

      echo "Генерация отчёта"
      allure awesome allure-results --single-file --output allure-report

      exit $status

  artifacts:
    when: always
    paths:
      - allure-results
      - allure-report
    expire_in: 7 days

e2e_tests:
  stage: tests
  trigger:
    project: python-auto-qa/workspaces/altair/SOYBR/pokemonbattle_e2e_tests_playwright
    branch: SOYBR-57
  rules:
    - when: always

final_job:
  allow_failure: true
  stage: final
  rules:
    - when: manual

  script:
    - echo "Pipeline завершён"